name = "ieltstrainer"
account_id = "3db9ec631ecc552814577d0ec8cfe45c"
main = "backend/worker.js"
compatibility_date = "2026-10-29"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "./frontend/frontendSE/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]


[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6cb7b3f23d9c45a1b66c9d0ec9f3a57c"
localConnectionString = "postgres://postgres:postgres@localhost:5432/english_platform"

# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
# ...
