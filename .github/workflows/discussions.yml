name: Lesson discussions

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - "frontend/frontendSE/**"
      - ".github/workflows/discussions.yml"
  push:
    branches: [feature/issue-34-lesson-discussions]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: discussions_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/frontendSE/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:discussions
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/discussions_test
      - run: npm ci
        working-directory: frontend/frontendSE
      - name: Lint forum and notification changes
        working-directory: frontend/frontendSE
        run: >-
          npx eslint src/components/Lesson/DiscussionForum.jsx
          src/services/discussionService.js src/pages/ProfilePage/Notifications.jsx
          src/components/Homepage/NotificationBell.jsx src/components/Homepage/Header.jsx
          src/pages/LessonPage/Lesson.jsx
      - run: npm run build
        working-directory: frontend/frontendSE
